flutter_launcher_icons:
  android: true
  image_path: "assets/icons/launcher_main.png"
  # Adaptive icons, so modern launchers mask a foreground over a ground instead
  # of shrinking a square. The monochrome layer is what Android 13+ tints to the
  # user's wallpaper theme — it is the closest thing Android has to a dark icon.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/launcher_fg.png"
  # the foreground already carries its safe area; the default 16% inset
  # would compound with it and shrink the mark to ~39% of the tile
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/launcher_main_mono.png"
  # matches minSdkVersion in android/app/build.gradle
  min_sdk_android: 26
  ios: true
  remove_alpha_ios: true
  # iOS 18 light/dark/tinted. The dark artwork is transparent on purpose: the
  # system composites it on its own dark ground, so shipping it opaque would
  # paint a white tile inside the dark icon.
  image_path_ios_dark_transparent: "assets/icons/launcher_main_dark.png"
  image_path_ios_tinted_grayscale: "assets/icons/launcher_main_mono.png"
  macos:
    generate: true
    image_path: "assets/icons/launcher_main.png"
  web:
    generate: true
    image_path: "assets/icons/launcher_main_macos.png"

# to generate: dart run flutter_launcher_icons -f flutter_launcher_icons-prod.yaml
