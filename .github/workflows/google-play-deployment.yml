name: "Google Play Deployment"

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
        description: "AWS region where secrets are stored"
      aws_role:
        required: true
        type: string
        description: "AWS role to assume to get secrets"
      secrets_bucket:
        required: true
        type: string
        description: "S3 bucket where secrets are stored"
      environment:
        required: true
        type: string
        description: "App environment"
      flavor:
        required: true
        type: string
        description: "Flutter flavour"
      app_id:
        required: true
        type: string
        description: "Google Play app ID"
      track:
        required: false
        type: string
        description: "Google Play track"
        default: 'internal'
      status:
        required: false
        type: string
        # A draft release is uploaded but distributed to nobody, which is what
        # we want while a build is being looked at — and exactly what we do not
        # want on a closed track, where Google counts only days a published
        # release spent in testers' hands.
        description: "Release status: draft (uploaded, not distributed) or completed (live on the track)"
        default: 'draft'

jobs:
  deploy:
    name: "Deploy to Google Play"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ inputs.aws_region }}

      - name: "Fetch secrets from S3"
        run: |
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/appconfig.json appconfig.json

          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/keystore.jks android/keystore.jks
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/key.properties android/key.properties
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/google-services.json android/app/google-services.json
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/playstore-sa-key.json playstore-sa-key.json  
         
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/firebase_options.dart lib/firebase_options.dart
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/firebase_options_prod.dart lib/firebase_options_prod.dart

      # AGP 9.3's bundled lint calls List.removeLast(), a JDK 21 API,
      # so lintVital crashes on the runner's default JDK 17
      - name: "Set up JDK"
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "Read pinned Flutter version"
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: "Set up Flutter"
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-key: pub-${{ hashFiles('pubspec.lock') }}

      # sqlite3 3.x bundles its native lib via Dart build hooks;
      # needed to ship latest SQLite to older versions of Android
      - name: "Enable native asset bundling"
        run: flutter config --enable-native-assets

      - name: "Date this release in What's new"
        # the release's entry is committed undated: its tag is pushed after the
        # commit, so only the prod build knows the day it shipped. Dev builds
        # leave it undated, and the card shows no date.
        if: inputs.environment == 'prod'
        run: dart scripts/whats_new.dart stamp

      - name: "Build app bundle"
        run: flutter build appbundle --release --flavor ${{ inputs.flavor }} --build-number ${{ github.run_number }} --dart-define-from-file=appconfig.json

      # A resource named only at runtime — by a Dart string, or by a library
      # calling getIdentifier() — is invisible to the resource shrinker, which
      # drops it from release builds while debug keeps working.
      #
      # The list is read out of keep.xml rather than repeated here, so the guard
      # and the keep rules cannot drift apart. Add a resource there and it is
      # checked here automatically.
      - name: "Shrinker kept everything keep.xml asks for"
        run: |
          set -euo pipefail
          report="build/app/outputs/mapping/${{ inputs.flavor }}Release/resources.txt"
          keep="android/app/src/main/res/raw/keep.xml"

          if [ ! -f "$report" ]; then
            echo "::error::No shrinker report at $report. Either resource shrinking is off \
          (then this guard is pointless and should go) or the path moved in an AGP upgrade \
          (then fix the path — do not delete the check)."
            exit 1
          fi

          # `while read` rather than `for x in $list`: word-splitting an
          # unquoted expansion is a bash-ism, and a guard that checks one entry
          # under zsh and all of them under bash is not a guard.
          grep -o 'tools:keep="[^"]*"' "$keep" | sed 's/tools:keep="//; s/"//' | tr ',' '\n' > /tmp/keep-entries
          [ -s /tmp/keep-entries ] || { echo "::error::No tools:keep entries found in $keep"; exit 1; }

          failed=0
          checked=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            checked=$((checked + 1))
            res=$(printf '%s' "$entry" | sed 's|^@||; s|/|:|')
            line=$(grep -m1 "^${res}:" "$report" || true)
            if [ -z "$line" ]; then
              echo "::error::$res is not in the shrinker report at all — was it renamed or removed?"
              failed=1
            elif printf '%s' "$line" | grep -q "is not reachable"; then
              echo "::error::$res was shrunk out of the release build: $line"
              failed=1
            else
              echo "ok: $line"
            fi
          done < /tmp/keep-entries

          echo "checked $checked resource(s)"
          exit $failed

      - name: "Upload to Play Store"
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: "playstore-sa-key.json"
          packageName: ${{ inputs.app_id }}
          releaseFiles: "build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab"
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          # Written by the `release-notes` skill. Files are named whatsnew-<locale>
          # and capped at 500 characters each; the release lands as a draft, so
          # they stay editable in the Play Console afterwards.
          whatsNewDirectory: release_notes/whatsnew