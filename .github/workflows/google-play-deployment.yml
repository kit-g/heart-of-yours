name: "Google Play Deployment"

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
        description: "AWS region where secrets are stored"
      aws_role:
        required: true
        type: string
        description: "AWS role to assume to get secrets"
      secrets_bucket:
        required: true
        type: string
        description: "S3 bucket where secrets are stored"
      environment:
        required: true
        type: string
        description: "App environment"
      flavor:
        required: true
        type: string
        description: "Flutter flavour"
      app_id:
        required: true
        type: string
        description: "Google Play app ID"
      track:
        required: false
        type: string
        description: "Google Play track"
        default: 'internal'

jobs:
  deploy:
    name: "Deploy to Google Play"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role }}
          aws-region: ${{ inputs.aws_region }}

      - name: "Fetch secrets from S3"
        run: |
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/appconfig.json appconfig.json

          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/keystore.jks android/keystore.jks
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/key.properties android/key.properties
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/google-services.json android/app/google-services.json
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/playstore/playstore-sa-key.json playstore-sa-key.json  
         
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/firebase_options.dart lib/firebase_options.dart
          aws s3 cp s3://${{ inputs.secrets_bucket }}/secrets/firebase/firebase_options_prod.dart lib/firebase_options_prod.dart

      # AGP 9.3's bundled lint calls List.removeLast(), a JDK 21 API,
      # so lintVital crashes on the runner's default JDK 17
      - name: "Set up JDK"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "Read pinned Flutter version"
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: "Set up Flutter"
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true

      # sqlite3 3.x bundles its native lib via Dart build hooks;
      # needed to ship latest SQLite to older versions of Android
      - name: "Enable native asset bundling"
        run: flutter config --enable-native-assets

      - name: "Build app bundle"
        run: flutter build appbundle --release --flavor ${{ inputs.flavor }} --build-number ${{ github.run_number }} --dart-define-from-file=appconfig.json

      - name: "Upload to Play Store"
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJson: "playstore-sa-key.json"
          packageName: ${{ inputs.app_id }}
          releaseFiles: "build/app/outputs/bundle/${{ inputs.flavor }}Release/app-${{ inputs.flavor }}-release.aab"
          track: ${{ inputs.track }}
          status: draft
          # Written by the `release-notes` skill. Files are named whatsnew-<locale>
          # and capped at 500 characters each; the release lands as a draft, so
          # they stay editable in the Play Console afterwards.
          whatsNewDirectory: release_notes/whatsnew