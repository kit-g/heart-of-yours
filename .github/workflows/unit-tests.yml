name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request: { }
  workflow_dispatch: { }
  workflow_call: { } # allows other workflows to call this one

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same make targets developers run locally — the recipe
# lives in the Makefile, not here.
jobs:
  lint:
    name: "Analyze"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@921d50dce8cdd6aaf578d12f91c013095de220e5 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: Analyze
        # codegen first: analysis needs the generated mocks
        run: make codegen codegen-app lint

  test_packages:
    name: "Pkg • ${{ matrix.package }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - heart_api
          - heart_db
          - heart_state
          - heart_charts
          - heart_language

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@921d50dce8cdd6aaf578d12f91c013095de220e5 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: "Run tests"
        run: make test-${{ matrix.package }}

  test_app:
    name: "App • tests"
    runs-on: ubuntu-latest
    needs: [ test_packages ]
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@921d50dce8cdd6aaf578d12f91c013095de220e5 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: Run app tests
        run: make test-app
