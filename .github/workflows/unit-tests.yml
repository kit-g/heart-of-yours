name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request: { }
  workflow_dispatch: { }
  workflow_call: { } # allows other workflows to call this one

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs the same make targets developers run locally — the recipe
# lives in the Makefile, not here.
jobs:
  lint:
    name: "Analyze"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          # The pub cache is keyed on the lockfile, not on the branch. The action's
          # default key is the branch name, which never changes — so a cache populated
          # under one set of dependencies is restored forever. That bit hard: after
          # `heart_models` was bumped, every job failed in 17ms with "heart depends on
          # heart_models 1.8.0 from git which doesn't match any versions", because pub
          # resolved `ref: main` against the stale heart-api checkout inside the cache
          # and never went to the network.
          cache-key: pub-${{ hashFiles('pubspec.lock') }}
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: Analyze
        # codegen first: analysis needs the generated mocks
        run: make codegen codegen-app lint

  test_packages:
    name: "Pkg • ${{ matrix.package }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - heart_api
          - heart_db
          - heart_state
          - heart_charts
          - heart_language
          - heart_health

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-key: pub-${{ hashFiles('pubspec.lock') }}
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: "Run tests"
        run: make test-${{ matrix.package }} REPORTS_DIR="$GITHUB_WORKSPACE/test-reports"

      # even when tests fail — the summary exists for the runs that went wrong
      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.package }}
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 7

  test_app:
    name: "App • tests"
    runs-on: ubuntu-latest
    needs: [ test_packages ]
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-key: pub-${{ hashFiles('pubspec.lock') }}
          cache-sdk: true

      - name: Dependencies
        run: make deps

      - name: Run app tests
        run: make test-app REPORTS_DIR="$GITHUB_WORKSPACE/test-reports"

      # even when tests fail — the summary exists for the runs that went wrong
      - name: "Upload test report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-app
          path: test-reports/
          if-no-files-found: ignore
          retention-days: 7

  test_summary:
    name: "Test Summary"
    runs-on: ubuntu-latest
    needs: [ test_packages, test_app ]
    # The point of the summary is the runs that went wrong, so it must not be
    # skipped when a test job fails.
    if: always()
    steps:
      - uses: actions/checkout@v7

      # A cancelled or skipped test job leaves nothing to download; the summary
      # says so rather than failing and adding a second red X to the run.
      - name: "Collect reports"
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: test-reports
          merge-multiple: true

      - name: "Render summary"
        run: python3 scripts/test_summary.py test-reports >> "$GITHUB_STEP_SUMMARY"

  # The Android native layer has its own tests (#289): the App Functions'
  # plans and the command queue's encoding, plain JVM. The Flutter tool is
  # set up only because the Gradle build reads the Flutter SDK's path from
  # `local.properties`, which `pub get` writes.
  test_android:
    name: "Android • unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: 'stable'
          version: ${{ steps.flutter.outputs.version }}
          cache: true
          cache-key: pub-${{ hashFiles('pubspec.lock') }}
          cache-sdk: true

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # the wrapper script is gitignored (Flutter writes it on build), so
      # Gradle itself is set up at the wrapper's pinned version
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.0'

      # the google-services plugin wants its file for any task of the module;
      # the deploy job fetches the real one, the tests need only its shape
      - name: Dependencies
        run: |
          flutter pub get
          make lib/firebase_options.dart lib/firebase_options_prod.dart
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "me.heart.android.dev" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "me.heart.android" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyA00000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Test
        working-directory: android
        run: gradle :app:testDevDebugUnitTest --no-daemon

