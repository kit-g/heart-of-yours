version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # 18+ targets material_ui; see the note on go_router in pubspec.yaml
      - dependency-name: go_router
        versions: [ ">=18.0.0" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
