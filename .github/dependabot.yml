version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    ignore:
      # pinned to the health plugin's version; see android/app/build.gradle
      - dependency-name: androidx.health.connect:connect-client
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
