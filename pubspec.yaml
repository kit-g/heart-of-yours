name: heart
description: "Another fitness tracker"
publish_to: none

version: 1.5.0+1 # build number is managed by the GH action, version should be bumped manually

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

workspace:
  - "shared/heart_api"
  - "shared/heart_db"
  - "shared/heart_charts"
  - "shared/heart_health"
  - "shared/heart_language"
  - "shared/heart_state"

dependencies:
  app_settings: ^8.0.3
  cached_network_image: ^3.4.1
  feedback: ^3.1.0
  file_selector: ^1.0.3
  firebase_analytics: 12.4.6
  firebase_auth: 6.5.7
  firebase_core: 4.13.0
  fl_chart: 1.2.0
  flutter: { sdk: flutter }
  flutter_body_atlas: ^0.2.1
  flutter_driver: { sdk: flutter }
  flutter_local_notifications: ^22.3.0
  flutter_svg: ^2.2.3
  flutter_web_plugins: { sdk: flutter }
  go_router: ^17.1.0
  google_sign_in_web: 1.1.3 # required for the sign-in button on the web
  heart_api:
  heart_charts:
  heart_db:
  heart_health:
  heart_language:
  heart_models:
    git:
      url: "https://github.com/kit-g/heart-api.git"
      path: "shared/heart_models"
      ref: "main"
    version: 1.9.0
  heart_state:
  image_cropper: ^12.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  logging: ^1.3.0
  markdown_widget: ^2.3.2+8
  mime: ^2.0.0
  package_info_plus: ^10.2.0
  reorderable_grid: ^1.0.13
  sentry_flutter: ^9.27.0
  timezone: ^0.11.0

dev_dependencies:
  build_runner: ^2.16.0
  # imported by lib/main_driver.dart, a debug-only entrypoint — never by main.dart
  integration_test: { sdk: flutter }
  # both back the fake file picker in test/import_flow_test.dart
  file_selector_platform_interface: any
  plugin_platform_interface: any
  firebase_auth_mocks: ^0.15.0
  flutter_launcher_icons: ^0.14.3
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0
  health: any
  http: any
  mockito: ^5.8.1
  test: ^1.31.0

flutter:
  config:
    enable-swift-package-manager: true

  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/svg/

  fonts:
    - family: "Lato"
      fonts:
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Lato/Lato-Light.ttf
          weight: 200

    - family: "Onest"
      fonts:
        - asset: assets/fonts/Onest/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest/Onest-700.ttf
          weight: 700

    - family: "Unbounded"
      fonts:
        - asset: assets/fonts/Unbounded/Unbounded-500.ttf
          weight: 500
        - asset: assets/fonts/Unbounded/Unbounded-700.ttf
          weight: 700

    - family: "Golos Text"
      fonts:
        - asset: assets/fonts/Golos_Text/Golos_Text-400.ttf
          weight: 400
        - asset: assets/fonts/Golos_Text/Golos_Text-500.ttf
          weight: 500
        - asset: assets/fonts/Golos_Text/Golos_Text-600.ttf
          weight: 600
        - asset: assets/fonts/Golos_Text/Golos_Text-700.ttf
          weight: 700

    - family: "Literata"
      fonts:
        - asset: assets/fonts/Literata/Literata-500.ttf
          weight: 500
        - asset: assets/fonts/Literata/Literata-600.ttf
          weight: 600

    - family: "IBM Plex Sans"
      fonts:
        - asset: assets/fonts/IBM_Plex_Sans/IBM_Plex_Sans-400.ttf
          weight: 400
        - asset: assets/fonts/IBM_Plex_Sans/IBM_Plex_Sans-500.ttf
          weight: 500
        - asset: assets/fonts/IBM_Plex_Sans/IBM_Plex_Sans-600.ttf
          weight: 600
        - asset: assets/fonts/IBM_Plex_Sans/IBM_Plex_Sans-700.ttf
          weight: 700

    - family: "Noto Sans"
      fonts:
        - asset: assets/fonts/Noto_Sans/NotoSans-VariableFont_wdth,wght.ttf

    - family: "Daydream"
      fonts:
        - asset: assets/fonts/Daydream.ttf
          weight: 400
          style: normal

    - family: "Icons"
      fonts:
        - asset: assets/fonts/Icons.ttf
