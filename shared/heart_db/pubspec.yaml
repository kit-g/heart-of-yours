name: heart_db
description: "Heart app's local database"
version: 0.1.0
homepage: 'https://github.com/kit-g/heart-of-yours'
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # models.dart only — the vocabulary, not the plugin. Importing
  # `heart_health.dart` here would drag `package:health` (and a platform
  # channel) into a package that only ever writes rows.
  heart_health:
  heart_models:
    git:
      url: "https://github.com/kit-g/heart-api.git"
      path: "shared/heart_models"
      ref: "main"
  logging: ^1.3.0
  path: ^1.9.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.0.0
  # sqlite3 3.x bundles the native SQLite (JSON1 enabled) via Dart build hooks,
  # replacing the deprecated sqlite3_flutter_libs. sqflite_common_ffi opens
  # through this, so the FFI path uses the bundled lib, not the OS one.
  sqlite3: ^3.0.0

resolution: workspace

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mockito: ^5.8.1
  build_runner: ^2.4.6
  sqflite_common: any
