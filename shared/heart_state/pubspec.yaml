name: heart_state
description: "State authority"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  firebase_auth: 6.5.7
  firebase_core: 4.13.0
  flutter: { sdk: flutter }
  google_sign_in: ^7.2.0
  heart_health:
  heart_models:
    git:
      url: "https://github.com/kit-g/heart-api.git"
      path: "shared/heart_models"
      ref: "main"
    version: 1.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sign_in_with_apple: ^8.0.0

resolution: workspace

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.10.4
  firebase_auth_mocks: ^0.15.0
  coverage: ^1.3.0
  firebase_auth_platform_interface: 9.0.6
