[package]
name = "sealbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "End-to-end encryption between devices, on vodozemac. Knows nothing about any app, server or store."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true
lto = true
opt-level = "s"
panic = "abort"
codegen-units = 1

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hmac = "0.13.0"
serde_json = "1.0.154"
sha2 = "0.11.0"
vodozemac = "0.11"

[dev-dependencies]
hex = "0.4.3"
