plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "com.google.devtools.ksp"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "me.heart"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // Enables custom resValue usage in product flavors
        resValues = true
        buildConfig = true
    }

    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        applicationId = "me.heart.android"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion 26
        multiDexEnabled true
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // 37: androidx.appfunctions compiles against the Android 17 APIs (#289)
        compileSdk 37
    }

    // Guarded, because Gradle evaluates this block whichever build type you
    // asked for: without `key.properties` — which is gitignored — a fresh
    // checkout could not even build debug, dying at configuration time with
    // "Cannot convert 'null' to File" and pointing at the *release* keystore.
    // `buildTypes` below already guards the same way.
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // use rootProject.file to ensure we look in the 'android' folder
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Heart dev"
            // One host, two uses: the universal-link filter and the privacy
            // policy ViewPermissionUsageActivity hands to the browser.
            def host = "dev.heart-of.me"
            manifestPlaceholders.deepLink = host
            resValue "string", "privacy_policy_url", "https://" + host + "/privacy.html"
        }

        prod {
            dimension "default"
            applicationIdSuffix ""
            resValue "string", "app_name", "Heart"
            def host = "heart-of.me"
            manifestPlaceholders.deepLink = host
            resValue "string", "privacy_policy_url", "https://" + host + "/privacy.html"
        }
    }

    ndkVersion = "28.2.13676358"
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // ShortcutManagerCompat, for the launcher's template shortcuts (#286)
    implementation 'androidx.core:core:1.13.1'
    // App Functions (#289): the assistant calls the app's functions in-process
    // on Android 16+; the compiler generates the service and its metadata
    implementation 'androidx.appfunctions:appfunctions:1.0.0-alpha13'
    ksp 'androidx.appfunctions:appfunctions-compiler:1.0.0-alpha13'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    // org.json on the JVM, for the plans' tests; on the device it is the platform's
    testImplementation 'org.json:json:20240303'
    // the functions called through the platform, on an Android 16 emulator
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test:runner:1.3.0' // the version a plugin pins on the main classpath
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}

ksp {
    arg("appfunctions:aggregateAppFunctions", "true")
    // Android 16's indexer reads the first metadata format (the `android.app.appfunctions`
    // property); the v2 file is for what comes after. Both are shipped.
    arg("appfunctions:generateV1Xml", "true")
}

// The App Functions compiler names a generated registry after the Kotlin
// module, which Gradle calls "android:app" here — a colon no class name can
// carry. A module name of our own.
kotlin {
    compilerOptions {
        moduleName = "heart"
    }
}